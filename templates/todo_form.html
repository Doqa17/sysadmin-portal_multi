{% extends "base.html" %}
{% block title %}{{ 'Редактирование задачи' if edit else 'Новая задача' }} — IT Helpdesk{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <h2 class="mb-0">{{ 'Редактирование задачи' if edit else 'Новая задача' }}</h2>
    <a href="{{ url_for('todos') }}" class="btn btn-sm btn-back">← Назад</a>
</div>

<div class="card p-4">
    <form method="post">
        {% if not edit %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label">Описание задачи</label>
                <textarea name="description" class="form-control" rows="4" placeholder="Что нужно сделать?" required>{{ todo.description if todo else '' }}</textarea>
            </div>
            {% if edit %}
            <div class="col-12">
                <div class="form-check">
                    <input type="checkbox" name="done" class="form-check-input" id="doneCb" {{ 'checked' if todo.done }}>
                    <label class="form-check-label" for="doneCb">Задача выполнена</label>
                </div>
            </div>
            {% endif %}
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-save">Сохранить</button>
            <a href="{{ url_for('todos') }}" class="btn btn-back">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
