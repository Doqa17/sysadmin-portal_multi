{% extends "base.html" %}
{% block title %}Задача — IT Helpdesk{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <h2 class="mb-0">Задача</h2>
    <a href="{{ url_for('todos') }}" class="btn btn-sm btn-back">← Назад</a>
</div>
<div class="card p-4" style="max-width:520px;">
    <div class="d-flex align-items-start gap-3">
        <div class="todo-checkbox {{ 'done' if todo.done }}">{{ '✓' if todo.done }}</div>
        <div>
            <div class="fw-semibold {{ 'text-decoration-line-through text-muted' if todo.done }}">{{ todo.description }}</div>
            <div class="text-muted small mt-1">{{ todo.created_at.strftime("%d.%m.%Y %H:%M") }}</div>
        </div>
    </div>
    <div class="d-flex gap-2 mt-4">
        <a href="{{ url_for('toggle_todo', todo_id=todo.id) }}" class="btn btn-sm btn-outline-primary">
            {{ '↩ Вернуть' if todo.done else '✓ Выполнено' }}
        </a>
        <a href="{{ url_for('edit_todo', todo_id=todo.id) }}" class="btn btn-sm btn-edit">✏️ Изменить</a>
        <a href="{{ url_for('delete_todo', todo_id=todo.id) }}" class="btn btn-sm btn-delete"
            onclick="return confirm('Удалить задачу?');">🗑</a>
    </div>
</div>
{% endblock %}
